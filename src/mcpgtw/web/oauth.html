<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>$title · $application</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: system-ui, sans-serif;
            color: #fafafa;
            background: #090909;
            --muted: #a1a1aa;
            --hint: #a1a1aa;
            --border: #292929;
        }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: 48px 24px; }
        main { width: 100%; max-width: 440px; min-width: 0; }
        .brand { margin: 0 0 28px; color: var(--muted); font-size: 13px; font-weight: 500; overflow-wrap: anywhere; }
        h1 { font-size: clamp(34px, 8vw, 42px); line-height: 1.15; letter-spacing: -1.2px; font-weight: 700; margin: 0 0 16px; overflow-wrap: anywhere; }
        p { margin: 0 0 28px; font-size: 16px; line-height: 1.6; color: var(--muted); overflow-wrap: anywhere; }
        strong { color: #fafafa; }
        form { margin-top: 36px; }
        .field { margin-bottom: 26px; }
        label { display: block; margin-bottom: 10px; font-size: 14px; font-weight: 500; }
        input:not([type="hidden"]) { width: 100%; min-height: 54px; padding: 15px 17px; border: 1px solid var(--border); border-radius: 9px; background: #090909; color: #fafafa; font: inherit; font-size: 16px; }
        input::placeholder { color: var(--muted); opacity: 1; }
        input:hover { border-color: #525252; }
        .hint { display: block; margin-top: 7px; color: var(--hint); font-size: 12px; line-height: 1.5; }
        .actions { display: grid; gap: 12px; margin-top: 32px; }
        button { width: 100%; min-height: 52px; padding: 14px 18px; border: 1px solid transparent; border-radius: 9px; background: #fafafa; color: #090909; font: inherit; font-size: 16px; font-weight: 600; cursor: pointer; }
        button:hover { background: #e4e4e7; }
        button.secondary { background: transparent; color: #fafafa; border-color: var(--border); }
        button.secondary:hover { background: #171717; border-color: #525252; }
        :focus-visible { outline: 2px solid #fafafa; outline-offset: 3px; }
        .notice { margin-bottom: 20px; padding: 12px 14px; border: 1px solid #4b2929; border-radius: 9px; background: #211616; color: #f2a6b0; font-size: 13px; line-height: 1.5; }
        .registration-note { margin: 16px 0 0; font-size: 12px; text-align: center; }
        .permissions { padding: 14px 16px; border: 1px solid var(--border); border-radius: 9px; background: #111111; font-size: 13px; color: #e4e4e7; }
        details { margin-top: 20px; font-size: 12px; color: var(--muted); }
        summary { cursor: pointer; padding: 14px 0; }
        dl { margin: 10px 0 0; }
        dt { margin-top: 12px; font-weight: 650; }
        dd { margin: 4px 0 0; line-height: 1.5; overflow-wrap: anywhere; }
        footer { margin-top: 28px; color: var(--hint); font-size: 12px; line-height: 1.5; }
        @media (max-width: 480px) { body { padding: 32px 20px; } .brand { margin-bottom: 24px; } }
        @media (max-height: 640px) { body { place-items: start center; } }
    </style>
</head>
<body>
    <main>
        <div class="brand">$application</div>
        <section aria-labelledby="page-title">
            <h1 id="page-title">$title</h1>
            $body
        </section>
        <footer>Your credentials stay with this authorization server.</footer>
    </main>
</body>
</html>
