<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>$title · $application</title>
    <style>
        :root { color-scheme: light; font-family: system-ui, sans-serif; color: #223b35; background: #f3f6f2; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: 32px 16px; background: radial-gradient(ellipse at top, #e0ece3, transparent 65%); }
        main { width: 100%; max-width: 440px; min-width: 0; }
        .brand { display: flex; align-items: center; gap: 10px; margin: 0 0 22px; font-size: 14px; font-weight: 650; overflow-wrap: anywhere; }
        .mark { flex: none; display: grid; place-items: center; width: 32px; height: 32px; border-radius: 10px; background: #244c3e; color: white; font-size: 18px; }
        .card { padding: clamp(22px, 6vw, 36px); border: 1px solid #dce4dc; border-radius: 20px; background: #fffefa; box-shadow: 0 16px 48px #223b350a; }
        h1 { font-size: 26px; line-height: 1.2; letter-spacing: -.6px; margin: 0 0 12px; overflow-wrap: anywhere; }
        p { margin: 0 0 24px; font-size: 14px; line-height: 1.6; color: #63716b; overflow-wrap: anywhere; }
        strong { color: #223b35; }
        form { margin-top: 24px; }
        .field { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-size: 13px; font-weight: 650; }
        input:not([type="hidden"]) { width: 100%; min-height: 48px; padding: 11px 13px; border: 1px solid #cbd5cd; border-radius: 10px; background: #fff; color: #223b35; font: inherit; font-size: 16px; }
        input:hover { border-color: #7d9987; }
        .hint { display: block; margin-top: 7px; color: #6a7870; font-size: 12px; line-height: 1.5; }
        .actions { display: grid; gap: 10px; }
        button { width: 100%; min-height: 46px; padding: 12px 16px; border: 1px solid transparent; border-radius: 10px; background: #244c3e; color: #fff; font: inherit; font-size: 14px; font-weight: 650; cursor: pointer; }
        button:hover { background: #193d30; }
        button.secondary { background: transparent; color: #244c3e; border-color: #cbd5cd; }
        button.secondary:hover { background: #edf3ed; }
        :focus-visible { outline: 3px solid #7fbaa0; outline-offset: 3px; }
        .notice { margin-bottom: 20px; padding: 12px 14px; border: 1px solid #eed5ca; border-radius: 10px; background: #fff5ef; color: #844631; font-size: 13px; line-height: 1.5; }
        .registration-note { margin: 16px 0 0; font-size: 12px; text-align: center; }
        .permissions { padding: 12px 14px; border-radius: 10px; background: #edf3ed; font-size: 13px; color: #244c3e; }
        details { margin-top: 20px; font-size: 12px; color: #63716b; }
        summary { cursor: pointer; padding: 8px 0; }
        dl { margin: 10px 0 0; }
        dt { margin-top: 12px; font-weight: 650; }
        dd { margin: 4px 0 0; line-height: 1.5; overflow-wrap: anywhere; }
        footer { margin-top: 20px; text-align: center; color: #78847d; font-size: 12px; line-height: 1.5; }
        @media (max-width: 480px) { body { padding: 24px 16px; } .brand { margin-bottom: 16px; } }
        @media (max-height: 640px) { body { place-items: start center; } }
    </style>
</head>
<body>
    <main>
        <div class="brand"><span class="mark" aria-hidden="true">↗</span><span>$application</span></div>
        <section class="card" aria-labelledby="page-title">
            <h1 id="page-title">$title</h1>
            $body
        </section>
        <footer>Your credentials stay with this authorization server.</footer>
    </main>
</body>
</html>
