name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install uv
        run: pip install uv==0.13.0
      - name: Create the environment
        run: make install
      - name: Lint
        run: make lint
      - name: Coverage gate
        run: make coverage

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24.21.0"
      - name: Install uv
        run: pip install uv==0.13.0
      - name: Create the environment
        run: make install
      - name: Install the browser toolchain
        run: |
          npm --prefix tests/e2e/browser ci --no-fund --no-audit
          tests/e2e/browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Cross-origin OAuth consent
        run: make consent-smoke
